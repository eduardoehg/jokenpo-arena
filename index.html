<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jokenpo Arena</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0b14" />
  </head>
  <body>
    <div class="cabinet">
      <!--
        Único no documento: o roteador de telas o move para o cabeçalho da tela
        ativa, onde o flexbox alinha os dois pela altura.
      -->
      <div class="lang-switch" id="lang-switch">
        <button class="btn lang-btn" data-lang="pt" type="button">PT</button>
        <button class="btn lang-btn" data-lang="en" type="button">EN</button>
      </div>

      <!-- ============ 1. CONFIGURAÇÃO ============ -->
      <section id="screen-config">
        <header class="screen-head" data-lang-slot>
          <h1 class="title">JOKENPO<br />ARENA</h1>
        </header>
        <p class="label subtitle" data-i18n="subtitle"></p>

        <div class="cards">
          <div class="panel card">
            <canvas class="card-icon" data-type="paper" width="96" height="96"></canvas>
            <div class="num card-name" data-i18n="typePaper"></div>
            <div class="stepper">
              <button class="btn step" data-bump="paper" data-delta="-5" type="button">-</button>
              <div class="num card-count" id="cfg-paper">030</div>
              <button class="btn step" data-bump="paper" data-delta="5" type="button">+</button>
            </div>
            <div class="label" data-i18n="portalNorth"></div>
          </div>

          <div class="panel card card--rock">
            <canvas class="card-icon" data-type="rock" width="96" height="96"></canvas>
            <div class="num card-name" data-i18n="typeRock"></div>
            <div class="stepper">
              <button class="btn step" data-bump="rock" data-delta="-5" type="button">-</button>
              <div class="num card-count" id="cfg-rock">030</div>
              <button class="btn step" data-bump="rock" data-delta="5" type="button">+</button>
            </div>
            <div class="label" data-i18n="portalWest"></div>
          </div>

          <div class="panel card card--scissors">
            <canvas class="card-icon" data-type="scissors" width="96" height="96"></canvas>
            <div class="num card-name" data-i18n="typeScissors"></div>
            <div class="stepper">
              <button class="btn step" data-bump="scissors" data-delta="-5" type="button">-</button>
              <div class="num card-count" id="cfg-scissors">030</div>
              <button class="btn step" data-bump="scissors" data-delta="5" type="button">+</button>
            </div>
            <div class="label" data-i18n="portalEast"></div>
          </div>
        </div>

        <div class="panel speed-panel">
          <div class="speed-head">
            <span class="label" data-i18n="speedBase"></span>
            <span class="num" id="cfg-speed">05</span>
          </div>
          <div class="speed-cells" id="speed-cells"></div>
        </div>

        <div class="panel seed-panel">
          <div class="seed-head">
            <span class="label" data-i18n="seed"></span>
            <span class="label seed-hint" data-i18n="seedHint"></span>
          </div>
          <div class="seed-row">
            <span class="num seed-value" id="cfg-seed">000000</span>
            <button class="btn btn-ghost seed-new" id="btn-new-seed" type="button" data-i18n="newSeed"></button>
          </div>
        </div>

        <button class="btn-primary btn-start" id="btn-start" type="button" data-i18n="startBattle"></button>

        <div class="history-block">
          <div class="label" data-i18n="history"></div>
          <div class="history" id="history-config"></div>
        </div>
      </section>

      <!-- ============ 2. ARENA ============ -->
      <section id="screen-arena" class="hidden">
        <header class="screen-head" data-lang-slot>
          <h1 class="title title--compact">JOKENPO ARENA</h1>
        </header>

        <div class="scoreboard">
          <div class="seg seg--paper" id="seg-paper"><span id="segn-paper">030</span></div>
          <div class="seg seg--rock" id="seg-rock"><span id="segn-rock">030</span></div>
          <div class="seg seg--scissors" id="seg-scissors"><span id="segn-scissors">030</span></div>
        </div>

        <div class="layout">
          <aside class="col col--left">
            <div>
              <div class="label" data-i18n="rules"></div>
              <ul class="rules">
                <li data-i18n="rulePaper"></li>
                <li data-i18n="ruleRock"></li>
                <li data-i18n="ruleScissors"></li>
              </ul>
            </div>
            <div>
              <div class="label" data-i18n="battles"></div>
              <div class="num accent" id="battles">0000</div>
            </div>
          </aside>

          <div class="arena-wrap">
            <canvas id="arena"></canvas>
          </div>

          <aside class="col col--right">
            <div class="panel">
              <div class="label" data-i18n="livePopulation"></div>
              <div class="stat stat--paper">
                <span data-i18n="typePaper"></span><span class="num" id="count-paper">030</span>
              </div>
              <div class="stat stat--rock">
                <span data-i18n="typeRock"></span><span class="num" id="count-rock">030</span>
              </div>
              <div class="stat stat--scissors">
                <span data-i18n="typeScissors"></span><span class="num" id="count-scissors">030</span>
              </div>
            </div>

            <div class="panel">
              <div class="label" data-i18n="elapsedTime"></div>
              <div class="num clock" id="clock">00:00</div>
            </div>

            <div class="panel">
              <div class="label" data-i18n="speed"></div>
              <div class="speed-row">
                <button class="btn speed-btn" data-speed="1" type="button">1X</button>
                <button class="btn speed-btn" data-speed="2" type="button">2X</button>
                <button class="btn speed-btn" data-speed="4" type="button">4X</button>
              </div>
            </div>

            <button class="btn btn-pause" id="btn-pause" type="button">PAUSAR</button>
            <button class="btn btn-ghost" id="btn-sound" type="button"></button>
            <button class="btn btn-ghost" id="btn-restart" type="button" data-i18n="restart"></button>
            <button class="btn btn-ghost" id="btn-home" type="button" data-i18n="home"></button>
          </aside>
        </div>
      </section>

      <!-- ============ 3. FIM DE PARTIDA ============ -->
      <section id="screen-end" class="hidden">
        <div class="end-head" data-lang-slot>
          <canvas id="winner-icon" width="224" height="224"></canvas>
          <div class="end-info">
            <div class="label" data-i18n="matchOver"></div>
            <div class="num end-title" id="winner-name"></div>
            <div class="end-stats">
              <div>
                <div class="label" data-i18n="totalTime"></div>
                <div class="num end-stat" id="end-time">00:00</div>
              </div>
              <div>
                <div class="label" data-i18n="battles"></div>
                <div class="num end-stat accent" id="end-battles">0000</div>
              </div>
              <div>
                <div class="label" data-i18n="initialSetup"></div>
                <div class="num end-stat" id="end-setup">30/30/30</div>
              </div>
              <div>
                <div class="label" data-i18n="seed"></div>
                <div class="num end-stat" id="end-seed">000000</div>
              </div>
            </div>

            <button class="btn btn-ghost btn-share" id="btn-share" type="button" data-i18n="copyLink"></button>
          </div>
        </div>

        <div class="chart-block">
          <div class="label" data-i18n="populationEvolution"></div>
          <div class="chart" id="chart"></div>
        </div>

        <div class="end-actions">
          <button class="btn-primary" id="btn-again" type="button" data-i18n="playAgain"></button>
          <button class="btn btn-ghost" id="btn-end-home" type="button" data-i18n="home"></button>
        </div>

        <div class="history-block">
          <div class="label" data-i18n="history"></div>
          <div class="history" id="history-end"></div>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
