name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy via OIDC, sem token de longa duração.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Sem cancelar o que está em voo: interromper uma
# publicação no meio deixaria o site num estado parcial.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O deploy não publica nada que não passe nos testes.
      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
