name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` e não `install`: instala exatamente o que está no lock, e falha se
      # o package.json e o lock estiverem fora de sincronia.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
